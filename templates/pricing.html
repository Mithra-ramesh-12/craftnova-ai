{% extends "base.html" %}

{% block content %}

<div class="module-heading">

    <h1>{{ t("AI Pricing") }}</h1>

    <p>{{ t("AI Pricing Assistant") }}</p>

</div>


<div class="module-card">

    <h2>{{ t("Get Price Recommendation") }}</h2>

    <p>
        {{ t("Get an AI-based price recommendation") }}
    </p>


    <form method="POST">

        <div class="form-grid">


            <div class="form-group">

                <label>{{ t("Product Type") }}</label>

                <input
                    type="text"
                    name="product_type"
                    required>

            </div>


            <div class="form-group">

                <label>{{ t("Material Cost") }}</label>

                <input
                    type="number"
                    step="0.01"
                    name="material_cost"
                    required>

            </div>


            <div class="form-group">

                <label>{{ t("Labour Cost") }}</label>

                <input
                    type="number"
                    step="0.01"
                    name="labour_cost"
                    required>

            </div>


            <div class="form-group">

                <label>{{ t("Production Cost") }}</label>

                <input
                    type="number"
                    step="0.01"
                    name="production_cost"
                    required>

            </div>


            <div class="form-group full">

                <label>{{ t("Market Information") }}</label>

                <textarea name="market_info"></textarea>

            </div>

        </div>


        <div class="button-row">

            <button class="primary-btn">

                ₹ {{ t("Get Price Recommendation") }}

            </button>

        </div>

    </form>

</div>


{% if result %}

<div class="module-card">

    <h2>{{ t("Recommended Price") }}</h2>

    <div class="result-box">
        {{ result }}
    </div>

</div>

{% endif %}

{% endblock %}
