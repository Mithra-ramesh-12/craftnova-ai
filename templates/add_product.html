{% extends "base.html" %}

{% block content %}

<div class="module-heading">

    <h1>{{ t("Add Product") }}</h1>

    <p>{{ t("Product Details") }}</p>

</div>


<div class="module-card">

    <h2>{{ t("Add New Product") }}</h2>

    <p>Enter your handmade product information below.</p>


    <form method="POST"
          enctype="multipart/form-data">


        <div class="form-grid">


            <div class="form-group">

                <label>{{ t("Product Name") }}</label>

                <input
                    type="text"
                    name="product_name"
                    placeholder="{{ t('Enter product name') }}"
                    required>

            </div>


            <div class="form-group">

                <label>{{ t("Category") }}</label>

                <input
                    type="text"
                    name="category"
                    placeholder="{{ t('Enter category') }}">

            </div>


            <div class="form-group">

                <label>{{ t("Material") }}</label>

                <input
                    type="text"
                    name="material"
                    placeholder="{{ t('Enter material') }}">

            </div>


            <div class="form-group">

                <label>{{ t("Color") }}</label>

                <input
                    type="text"
                    name="color"
                    placeholder="{{ t('Enter color') }}">

            </div>


            <div class="form-group">

                <label>{{ t("Size") }}</label>

                <input
                    type="text"
                    name="size"
                    placeholder="{{ t('Enter size') }}">

            </div>


            <div class="form-group">

                <label>{{ t("Price") }}</label>

                <input
                    type="number"
                    step="0.01"
                    name="price"
                    placeholder="{{ t('Enter price') }}">

            </div>


            <div class="form-group full">

                <label>{{ t("Description") }}</label>

                <textarea
                    name="description"
                    placeholder="{{ t('Enter description') }}"></textarea>

            </div>


            <div class="form-group full">

                <label>{{ t("Product Image") }}</label>

                <input
                    type="file"
                    name="image"
                    accept="image/*">

            </div>

        </div>


        <div class="button-row">

            <a href="{{ url_for('inventory') }}"
               class="secondary-btn">

                {{ t("Back") }}

            </a>

            <button type="submit"
                    class="primary-btn">

                + {{ t("Add Product") }}

            </button>

        </div>

    </form>

</div>

{% endblock %}
